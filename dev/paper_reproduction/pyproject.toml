[project]
name = "catalog-proxy-experiments"
version = "0.1.0"
description = "Reproducible experiments for catalog proxies in persistent recommender memory"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.10",
  "numpy>=2.0",
  "openai>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_proxy"]

[tool.uv]
package = true
